name: Agentic Review

on:
  workflow_run:
    workflows:
      - Phase 0 Validation
    types:
      - completed
  repository_dispatch:
    types:
      - agentic_review_requested
      - agentic_review_recorded
  issue_comment:
    types:
      - created
      - edited
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to validate
        required: true
        type: number

permissions: {}

concurrency:
  group: >-
    agentic-review-${{
      github.event.action == 'agentic_review_requested' && 'request' || 'validate'
    }}-${{ github.repository }}-${{
      github.event.workflow_run.pull_requests[0].number ||
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.client_payload.pull_request.number ||
      github.event.client_payload.pull_request ||
      inputs.pull_request ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  request-platform-review:
    name: request-trusted-codex-review
    if: >-
      ${{
        github.event_name == 'repository_dispatch' &&
        github.event.action == 'agentic_review_requested'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out target default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify installed runtime bytes
        run: >-
          python3 -I -S -B .github/robotics-harness/verify-runtime.py
          --repo "$GITHUB_WORKSPACE"
          --expected-manifest-sha "55bd4d3e8be4c81c44fd9a1fda0d02d955acde6a45f43c81e41d216e322f49c5"
          --expected-harness-ref "123f00b43f1251d2f4855a3a3c1a012819a7b358"

      - name: Resolve trusted review request context
        id: request_context
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from os import environ
          from pathlib import Path

          event = json.loads(Path(environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          payload = event.get("client_payload") or {}
          pull_request = payload.get("pull_request")
          if isinstance(pull_request, dict):
              pull_request = pull_request.get("number")
          if (
              isinstance(pull_request, bool)
              or not isinstance(pull_request, int)
              or pull_request < 1
          ):
              raise SystemExit("invalid repository_dispatch pull_request")

          head_sha = str(payload.get("head_sha") or "").strip()
          if re.fullmatch(r"[0-9a-fA-F]{40}", head_sha) is None:
              raise SystemExit("invalid repository_dispatch head_sha")

          with Path(environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"pull_request={pull_request}\n")
              output.write(f"head_sha={head_sha.lower()}\n")
          PY

      - name: Publish immutable platform review request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ steps.request_context.outputs.head_sha }}
          REVIEW_PULL_REQUEST: ${{ steps.request_context.outputs.pull_request }}
        shell: bash
        run: |
          command=(
            sh
            .github/robotics-harness/robotics-harness
            review-request-github
            --target-repo "$GITHUB_WORKSPACE"
            --runtime-root "$RUNNER_TEMP/agentic-review-request/state"
            --task-id "agentic-review-request:$REVIEW_PULL_REQUEST"
            --repository "$GITHUB_REPOSITORY"
            --pull-request "$REVIEW_PULL_REQUEST"
            --expected-head "$REVIEW_HEAD_SHA"
            --request-publisher-login "github-actions[bot]"
            --request-publisher-id "41898282"
            --request-publisher-type "Bot"
            --reviewer-login "chatgpt-codex-connector[bot]"
            --reviewer-id "199175422"
            --reviewer-type "Bot"
            --retry-after-seconds "120"
            --prior-head-wait-seconds "480"
            --prior-head-poll-seconds "5"
          )
          "${command[@]}"

  validate-review-state:
    name: validate-current-review-state
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0].number > 0) ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         ((github.event.action == 'created' &&
           github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
          (github.event.action == 'edited' &&
           (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
            github.event.comment.user.login == 'github-actions[bot]')))) ||
        (github.event_name == 'pull_request_review' &&
         github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
        (github.event_name == 'repository_dispatch' &&
         github.event.action == 'agentic_review_recorded')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out target default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Configure external runtime paths
        shell: bash
        run: |
          echo "HARNESS_ARTIFACTS_DIR=$RUNNER_TEMP/agentic-review/artifacts" >> "$GITHUB_ENV"
          echo "HARNESS_MONITORING_EVENT_STORE=$RUNNER_TEMP/agentic-review/monitoring-events.jsonl" >> "$GITHUB_ENV"
          echo "HARNESS_REVIEW_RUNTIME_DIR=$RUNNER_TEMP/agentic-review/runtime" >> "$GITHUB_ENV"

      - name: Verify installed runtime bytes
        run: >-
          python3 -I -S -B .github/robotics-harness/verify-runtime.py
          --repo "$GITHUB_WORKSPACE"
          --expected-manifest-sha "55bd4d3e8be4c81c44fd9a1fda0d02d955acde6a45f43c81e41d216e322f49c5"
          --expected-harness-ref "123f00b43f1251d2f4855a3a3c1a012819a7b358"

      - name: Resolve pull request context
        id: context
        shell: bash
        env:
          WORKFLOW_DISPATCH_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

          pull_request = None
          expected_head = ""
          if event_name == "workflow_run":
              workflow_run = event.get("workflow_run") or {}
              pull_requests = workflow_run.get("pull_requests") or []
              if pull_requests:
                  pull_request = pull_requests[0].get("number")
              expected_head = str(workflow_run.get("head_sha") or "").strip()
          elif event_name == "workflow_dispatch":
              raw_value = os.environ.get("WORKFLOW_DISPATCH_PULL_REQUEST", "").strip()
              pull_request = int(raw_value) if raw_value else None
          elif event_name == "issue_comment":
              issue = event.get("issue") or {}
              pull_request = issue.get("number")
          elif event_name == "pull_request_review":
              pull_request_payload = event.get("pull_request") or {}
              review = event.get("review") or {}
              pull_request = pull_request_payload.get("number")
              expected_head = str(review.get("commit_id") or "").strip()
          elif event_name == "repository_dispatch":
              payload = event.get("client_payload") or {}
              candidate = payload.get("pull_request")
              if isinstance(candidate, dict):
                  pull_request = candidate.get("number")
              else:
                  pull_request = candidate

          if isinstance(pull_request, bool) or not isinstance(pull_request, int) or pull_request < 1:
              raise SystemExit("could not resolve a pull request number from the workflow event")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"pull_request={pull_request}\n")
              if expected_head:
                  handle.write(f"expected_head={expected_head}\n")
          PY

      - name: Validate current recorded review state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command=(
            sh
            .github/robotics-harness/robotics-harness
            review-validate-github
            --target-repo "$GITHUB_WORKSPACE"
            --runtime-root "$RUNNER_TEMP/agentic-review/state"
            --task-id "agentic-review:${{ steps.context.outputs.pull_request }}"
            --repository "$GITHUB_REPOSITORY"
            --pull-request "${{ steps.context.outputs.pull_request }}"
            --trusted-reviewer-login "chatgpt-codex-connector[bot]"
            --trusted-reviewer-id "199175422"
            --trusted-reviewer-type "Bot"
            --trusted-request-publisher-login "github-actions[bot]"
            --trusted-request-publisher-id "41898282"
            --trusted-request-publisher-type "Bot"
          )
          if [ -n "${{ steps.context.outputs.expected_head }}" ]; then
            command+=(--expected-head "${{ steps.context.outputs.expected_head }}")
          fi
          "${command[@]}"

      - name: Upload validation monitoring store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentic-review-monitoring-${{ github.run_id }}
          path: ${{ runner.temp }}/agentic-review/monitoring-events.jsonl
          if-no-files-found: warn
          retention-days: 30
